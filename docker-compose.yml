name: secureai-gateway-demo

services:
  gateway:
    build:
      context: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      LLAMA_GUARD_MODE: ${LLAMA_GUARD_MODE:-mock}
      LLAMA_GUARD_URL: ${LLAMA_GUARD_URL:-http://llama-guard:8000}
      LLAMA_GUARD_API_KEY: ${LLAMA_GUARD_API_KEY:-}
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-workers-ai/@cf/meta/llama-guard-3-8b}
      LLAMA_GUARD_TIMEOUT_SECONDS: ${LLAMA_GUARD_TIMEOUT_SECONDS:-30}
      LLAMA_GUARD_ONLINE_URL: ${LLAMA_GUARD_ONLINE_URL:-}
      LLAMA_GUARD_ONLINE_API_KEY: ${LLAMA_GUARD_ONLINE_API_KEY:-}
      LLAMA_GUARD_ONLINE_MODEL: ${LLAMA_GUARD_ONLINE_MODEL:-workers-ai/@cf/meta/llama-guard-3-8b}
      LLAMA_GUARD_LOCAL_URL: ${LLAMA_GUARD_LOCAL_URL:-http://llama-guard:8000}
      LLM_MODE: ${LLM_MODE:-offline}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_ONLINE_URL: ${LLM_ONLINE_URL:-}
      LLM_ONLINE_API_KEY: ${LLM_ONLINE_API_KEY:-}
      LLM_ONLINE_MODEL: ${LLM_ONLINE_MODEL:-workers-ai/@cf/moonshotai/kimi-k2.6}
      LLM_LOCAL_URL: ${LLM_LOCAL_URL:-http://ollama:11434/v1}
      LLM_LOCAL_API_KEY: ${LLM_LOCAL_API_KEY:-}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-qwen2.5:0.5b-instruct}
      DEMO_OFFLINE_MODE: ${DEMO_OFFLINE_MODE:-true}
      DATABASE_PATH: /app/data/security.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - secureai-data:/app/data
    networks: [secureai]
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      GATEWAY_URL: http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks: [secureai]
    restart: unless-stopped

  llama-guard:
    build:
      context: ./llama-guard
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_GUARD_MODEL: ${OLLAMA_GUARD_MODEL:-llama-guard3:1b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    depends_on:
      ollama:
        condition: service_healthy
    networks: [secureai]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    networks: [secureai]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_GUARD_MODEL:-llama-guard3:1b}' && ollama list | grep -q '${LLM_LOCAL_MODEL:-qwen2.5:0.5b-instruct}'"]
      interval: 15s
      timeout: 10s
      retries: 10

networks:
  secureai:
    driver: bridge

volumes:
  secureai-data:
    name: secureai-gateway-audit-data
  ollama-models:
    name: secureai-gateway-ollama-models
